// ── GitHub API helpers ───────────────────────────────────────
async function ghGet(path, token){
  const r = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`,{
    headers:{ Authorization:`token ${token}`, Accept:'application/vnd.github.v3+json' }
  });
  if(!r.ok) throw new Error(`GitHub GET ${r.status}: ${await r.text()}`);
  return r.json();
}

async function ghPut(path, content, sha, token, message){
  const body = { message, content: btoa(unescape(encodeURIComponent(content))), branch: CONFIG.branch };
  if(sha) body.sha = sha;
  const r = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`,{
    method:'PUT',
    headers:{ Authorization:`token ${token}`, Accept:'application/vnd.github.v3+json', 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error(`GitHub PUT ${r.status}: ${await r.text()}`);
  return r.json();
}

async function loadPostsFromGitHub(token){
  try{
    const data = await ghGet(CONFIG.file, token);
    const json = decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    return { posts: JSON.parse(json), sha: data.sha };
  }catch(e){
    // File doesn't exist yet → seed with defaults
    if(e.message.includes('404')) return { posts: DEFAULT_POSTS, sha: null };
    throw e;
  }
}

async function savePostsToGitHub(posts, sha, token){
  const json = JSON.stringify(posts, null, 2);
  const now = new Date().toISOString().slice(0,16).replace('T',' ');
  return ghPut(CONFIG.file, json, sha, token, `Blog update ${now}`);
}

// ── Portfolio API helpers ─────────────────────────────────────
async function loadPortfolioFromGitHub(token){
  try{
    const data=await ghGet(CONFIG.portfolioFile,token);
    const json=decodeURIComponent(escape(atob(data.content.replace(/\n/g,''))));
    return{items:JSON.parse(json),sha:data.sha};
  }catch(e){
    if(e.message.includes('404'))return{items:[],sha:null};
    throw e;
  }
}

async function savePortfolioToGitHub(items,sha,token){
  const json=JSON.stringify(items,null,2);
  const now=new Date().toISOString().slice(0,16).replace('T',' ');
  return ghPut(CONFIG.portfolioFile,json,sha,token,`Portfolio update ${now}`);
}

async function optimizeImage(file){
  return new Promise(resolve=>{
    const MAX_W=1400,MAX_H=1050;
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth,h=img.naturalHeight;
      if(w>MAX_W||h>MAX_H){const r=Math.min(MAX_W/w,MAX_H/h);w=Math.round(w*r);h=Math.round(h*r);}
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      canvas.toBlob(blob=>{
        const reader=new FileReader();
        reader.onload=e=>resolve(e.target.result.split(',')[1]);
        reader.readAsDataURL(blob);
      },'image/webp',0.82);
    };
    img.src=url;
  });
}

async function uploadImageToGitHub(file,token){
  const base64=await optimizeImage(file);
  const filename=`${Date.now()}.webp`;
  const path=`images/portfolio/${filename}`;
  const r=await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`,{
    method:'PUT',
    headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    body:JSON.stringify({message:`Upload: ${filename}`,content:base64,branch:CONFIG.branch})
  });
  if(!r.ok)throw new Error(`Upload ${r.status}: ${await r.text()}`);
  return `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/main/${path}`;
}

// ── Toast ────────────────────────────────────────────────────
function Toast({msg,type,onClose}){
  useEffect(()=>{ if(type!=='saving'){ const t=setTimeout(onClose,3500); return()=>clearTimeout(t); } },[type]);
  return(
    <div style={S.toast(type)}>
      {type==='saving'&&<span style={{width:14,height:14,border:'1px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .8s linear infinite',flexShrink:0,display:'inline-block'}}/>}
      {msg}
    </div>
  );
}

// ── Setup screen (first run / token entry) ───────────────────

  const connect = async()=>{
    if(!token.trim()){setErr('Zadej GitHub Personal Access Token.');return;}
    setLoading(true);setErr('');
    try{
      // Verify token works by fetching user info
      const r = await fetch('https://api.github.com/user',{headers:{Authorization:`token ${token.trim()}`}});
      if(!r.ok) throw new Error('Token není platný nebo nemá dostatečná oprávnění.');
      onConnect(token.trim());
    }catch(e){ setErr(e.message); }
    finally{setLoading(false);}
  };

  return(
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:32}}>
      <div style={{width:'100%',maxWidth:520}}>
        <div style={{fontFamily:'var(--serif)',fontSize:36,fontWeight:300,marginBottom:8}}>
          Jan <span style={{color:'var(--accent)'}}>Novák</span>
        </div>
        <div style={{fontSize:11,letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--muted)',marginBottom:48}}>Blog Admin</div>

        {!configured&&(

            ⚠ Nejprve vyplň <code style={{color:'var(--accent)'}}>GITHUB_USER</code> a <code style={{color:'var(--accent)'}}>GITHUB_REPO</code> v souboru <code style={{color:'var(--accent)'}}>admin.html</code>.
          </div>
        )}

        <div style={S.fGroup}>
          <label style={S.label}>GitHub Personal Access Token</label>
          <input
            style={{...S.input,fontFamily:'monospace',letterSpacing:'0.05em'}}
            type="password"
            placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
            value={token}
            onChange={e=>setToken(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&connect()}
          />
          <div style={{marginTop:12,fontSize:11,color:'var(--muted)',lineHeight:1.8}}>
            Token potřebuje scope: <code style={{color:'var(--accent)'}}>repo</code> (nebo <code style={{color:'var(--accent)'}}>public_repo</code> pro veřejný repozitář).<br/>

            <strong style={{color:'var(--text)'}}>Token se neukládá</strong> — zadává se při každém přihlášení.
          </div>
        </div>

        {err&&<div style={{color:'var(--danger)',fontSize:12,marginBottom:16,padding:'10px 14px',border:'1px solid rgba(192,57,43,.3)',background:'rgba(192,57,43,.05)'}}>{err}</div>}

          {loading?'Ověřuji…':'Přihlásit se'}
        </button>
      </div>
    </div>
  );
}

    <div style={S.modalOverlay} onClick={e=>e.target===e.currentTarget&&onClose()}>

  );
}

// ── Portfolio Item Modal ─────────────────────────────────────
function PortfolioModal({item,onSave,onClose,saving,token}){
  const empty={title:'',description:'',image:'',tags:[],link:'',date:new Date().toISOString().slice(0,10),visible:true};
  const [form,setForm]=useState(item?{...item,tags:[...(item.tags||[])]}:empty);
  const [tagInput,setTagInput]=useState('');
  const [uploading,setUploading]=useState(false);
  const [err,setErr]=useState('');
  const [autoScreenshot,setAutoScreenshot]=useState(false);
  const [screenshotLoading,setScreenshotLoading]=useState(false);
  const [screenshotBase64,setScreenshotBase64]=useState(null);
  const [screenshotPreview,setScreenshotPreview]=useState(null);
  const fileRef=useRef(null);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  // Auto-načítání screenshotu
  useEffect(()=>{
    if(!autoScreenshot||!form.link){setScreenshotBase64(null);setScreenshotPreview(null);return;}
    let cancelled=false;
    setScreenshotLoading(true);setErr('');
    (async()=>{
      try{
        const r=await fetch(`https://image.thum.io/get/width/1200/crop/900/noanimate/${form.link}`);
        if(!r.ok)throw new Error(`HTTP ${r.status}`);
        const blob=await r.blob();
        if(cancelled)return;
        const file=new File([blob],'screenshot.jpg',{type:blob.type||'image/jpeg'});
        const b64=await optimizeImage(file);
        if(!cancelled){setScreenshotBase64(b64);setScreenshotPreview('data:image/webp;base64,'+b64);}
      }catch(e){
        if(!cancelled){setErr(`Screenshot: ${e.message}`);setAutoScreenshot(false);}
      }finally{
        if(!cancelled)setScreenshotLoading(false);
      }
    })();
    return()=>{cancelled=true;};
  },[autoScreenshot,form.link]);

  const clearScreenshot=()=>{setAutoScreenshot(false);setScreenshotBase64(null);setScreenshotPreview(null);};

  const addTag=val=>{const t=val.trim();if(t&&!form.tags.includes(t))setForm(f=>({...f,tags:[...f.tags,t]}));setTagInput('');};
  const removeTag=t=>setForm(f=>({...f,tags:f.tags.filter(x=>x!==t)}));
  const handleTagKey=e=>{
    if(e.key==='Enter'||e.key===','){e.preventDefault();addTag(tagInput);}
    if(e.key==='Backspace'&&!tagInput&&form.tags.length)removeTag(form.tags[form.tags.length-1]);
  };

  const handleUpload=async e=>{
    const file=e.target.files[0];if(!file)return;
    clearScreenshot();
    setUploading(true);setErr('');
    try{const url=await uploadImageToGitHub(file,token);set('image',url);}
    catch(ex){setErr(`Chyba nahrávání: ${ex.message}`);}
    finally{setUploading(false);e.target.value='';}
  };

  const submit=async()=>{
    if(!form.title.trim()){setErr('Název nesmí být prázdný.');return;}
    const finalForm={...form};
    if(tagInput.trim()&&!finalForm.tags.includes(tagInput.trim()))finalForm.tags=[...finalForm.tags,tagInput.trim()];
    // Nahrání screenshotu do GitHubu před uložením
    if(autoScreenshot&&screenshotBase64){
      setUploading(true);
      try{
        const filename=`${Date.now()}.webp`;
        const path=`images/portfolio/${filename}`;
        const r=await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${path}`,{
          method:'PUT',
          headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
          body:JSON.stringify({message:`Upload: ${filename}`,content:screenshotBase64,branch:CONFIG.branch})
        });
        if(!r.ok)throw new Error(`Upload ${r.status}: ${await r.text()}`);
        finalForm.image=`https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/main/${path}`;
      }catch(e){setErr(`Chyba nahrávání screenshotu: ${e.message}`);setUploading(false);return;}
      setUploading(false);
    }
    onSave(finalForm);
  };

  const previewImg=screenshotPreview||form.image;
  const busy=saving||uploading||screenshotLoading;

  return(
    <div style={S.modalOverlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...S.modal,maxWidth:760}}>
        <div style={S.modalHead}>
          <span style={{fontFamily:'var(--serif)',fontSize:24,fontWeight:300}}>{item?'Upravit položku':'Nová položka portfolia'}</span>
          <button style={S.closeBtn} onClick={onClose}>×</button>
        </div>
        <div style={S.modalBody}>
          {err&&<div style={{color:'var(--danger)',fontSize:12,marginBottom:16,padding:'10px 14px',border:'1px solid rgba(192,57,43,.3)'}}>{err}</div>}
          <div style={S.fGroup}>
            <label style={S.label}>Název *</label>
            <input style={S.input} value={form.title} onChange={e=>{set('title',e.target.value);setErr('');}} placeholder="Název projektu..."/>
          </div>
          <div style={S.fGroup}>
            <label style={S.label}>Popis</label>
            <textarea style={{...S.textarea,minHeight:80}} value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Krátký popis projektu..."/>
          </div>
          <div style={S.fGroup}>
            <label style={S.label}>Obrázek</label>
            {previewImg&&(
              <div style={{marginTop:8,marginBottom:8,height:140,backgroundImage:`url(${previewImg})`,backgroundSize:'cover',backgroundPosition:'center top',border:'1px solid var(--border)',position:'relative'}}>
                {screenshotPreview&&<span style={{position:'absolute',bottom:6,left:8,fontSize:9,letterSpacing:'.12em',textTransform:'uppercase',color:'rgba(255,255,255,.85)',background:'rgba(0,0,0,.55)',padding:'2px 8px'}}>screenshot preview</span>}
                <button onClick={()=>{set('image','');clearScreenshot();}} style={{position:'absolute',top:6,right:6,background:'rgba(0,0,0,.75)',border:'none',color:'#fff',width:22,height:22,cursor:'pointer',fontSize:14,lineHeight:'22px',textAlign:'center'}}>×</button>
              </div>
            )}
            {screenshotLoading&&<div style={{height:140,marginTop:8,marginBottom:8,border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',gap:10,color:'var(--muted)',fontSize:11,letterSpacing:'.1em'}}>
              <span style={{width:14,height:14,border:'1px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',animation:'spin .8s linear infinite',display:'inline-block',flexShrink:0}}/>
              Načítám screenshot…
            </div>}
            <div style={{display:'flex',gap:8,marginTop:8}}>
              <input style={{...S.input,marginTop:0,flex:1}} value={form.image} onChange={e=>{set('image',e.target.value);if(e.target.value)clearScreenshot();}} placeholder="https://... nebo nahraj soubor →" disabled={!!screenshotPreview}/>
              <button style={{...S.btnGhost,flexShrink:0,opacity:uploading?.6:1}} onClick={()=>fileRef.current.click()} disabled={uploading||!!screenshotPreview}>
                {uploading?'Nahrávám…':'↑ Nahrát'}
              </button>
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handleUpload}/>
            </div>
          </div>
          <div style={S.fGroup}>
            <label style={S.label}>Tagy</label>
            <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:6,padding:'8px 12px',background:'var(--bg)',border:'1px solid var(--border)',marginTop:8,minHeight:44,cursor:'text'}}
              onClick={()=>document.getElementById('pf-tag-input').focus()}>
              {form.tags.map(t=>(
                <span key={t} style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 10px',background:'rgba(201,169,110,.1)',border:'1px solid rgba(201,169,110,.25)',color:'var(--accent)',fontSize:11,letterSpacing:'.05em'}}>
                  {t}
                  <button onClick={e=>{e.stopPropagation();removeTag(t);}} style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',padding:0,fontSize:13,lineHeight:1,marginLeft:2}}>×</button>
                </span>
              ))}
              <input id="pf-tag-input"
                style={{background:'none',border:'none',outline:'none',color:'var(--text)',fontFamily:'var(--mono)',fontSize:12,minWidth:140,flex:1,padding:0}}
                value={tagInput} onChange={e=>setTagInput(e.target.value)} onKeyDown={handleTagKey}
                onBlur={()=>tagInput.trim()&&addTag(tagInput)}
                placeholder={form.tags.length===0?'WordPress, Fotografie, … (Enter nebo čárka)':''}/>
            </div>
          </div>
          <div style={S.fGrid}>
            <div>
              <label style={S.label}>Odkaz na projekt</label>
              <input style={S.input} value={form.link} onChange={e=>{set('link',e.target.value);if(!e.target.value)clearScreenshot();}} placeholder="https://..."/>
              <label style={{display:'flex',alignItems:'center',gap:8,marginTop:10,cursor:form.link?'pointer':'default',opacity:form.link?1:.4,userSelect:'none'}}>
                <input type="checkbox" checked={autoScreenshot} onChange={e=>form.link&&setAutoScreenshot(e.target.checked)}
                  style={{accentColor:'var(--accent)',width:13,height:13,cursor:'inherit'}}/>
                <span style={{fontSize:10,letterSpacing:'.15em',textTransform:'uppercase',color:autoScreenshot?'var(--accent)':'var(--muted)'}}>
                  Pořídit screenshot webu
                </span>
              </label>
            </div>
            <div>
              <label style={S.label}>Datum</label>
              <input type="date" style={S.input} value={form.date} onChange={e=>set('date',e.target.value)}/>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <label style={{...S.label,marginBottom:0}}>Zobrazit na webu</label>
            <div style={{position:'relative',width:36,height:20,background:form.visible!==false?'rgba(201,169,110,.35)':'var(--border)',borderRadius:10,cursor:'pointer',transition:'background .2s',flexShrink:0}}
              onClick={()=>set('visible',form.visible===false)}>
              <div style={{position:'absolute',top:2,left:form.visible!==false?18:2,width:16,height:16,background:form.visible!==false?'var(--accent)':'var(--muted)',borderRadius:'50%',transition:'left .2s'}}/>
            </div>
            <span style={{fontSize:11,color:'var(--muted)'}}>{form.visible!==false?'Viditelné':'Skryto'}</span>
          </div>
        </div>
        <div style={S.modalFoot}>
          <span style={{fontSize:11,color:'var(--muted)'}}>{form.tags.length} {form.tags.length===1?'tag':'tagů'}</span>
          <div style={{display:'flex',gap:10}}>
            <button style={S.btnGhost} onClick={onClose} disabled={busy}>Zrušit</button>
            <button style={{...S.btnPrimary,opacity:busy?.6:1}} onClick={submit} disabled={busy}>
              {saving?'Ukládám…':uploading?'Nahrávám…':'Uložit'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

  return(
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>

                  }
                </td>

                  <div style={{display:'flex',flexWrap:'wrap',gap:4}}>

                    {(p.tags||[]).length>3&&<span style={{fontSize:9,color:'var(--muted)'}}>+{p.tags.length-3}</span>}
                  </div>
                </td>
                <td style={{...S.td,color:'var(--muted)',whiteSpace:'nowrap'}}>{p.date}</td>

                  <div style={{display:'flex',gap:6}}>
                    <button style={S.btnGhost} onClick={()=>onEdit(p)}>Upravit</button>
                    <button style={S.btnDanger} onClick={()=>onDelete(p)}>✕</button>

              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>

}

// ── Dashboard ────────────────────────────────────────────────

  return(
    <div>
      <div style={S.statsGrid}>
        <div style={S.stat}><div style={S.statNum}>{posts.length}</div><div style={S.statLabel}>Celkem článků</div></div>
        <div style={S.stat}><div style={{...S.statNum,color:'#6fcf97'}}>{pub.length}</div><div style={S.statLabel}>Živě na webu</div></div>
        <div style={S.stat}><div style={{...S.statNum,color:'var(--muted)'}}>{posts.length-pub.length}</div><div style={S.statLabel}>Koncepty</div></div>
      </div>
      <div style={S.card}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div style={{fontFamily:'var(--serif)',fontSize:20,fontWeight:300}}>Poslední články</div>
          <button style={S.btnGhost} onClick={()=>setPage('posts')}>Všechny →</button>
        </div>
        <table style={S.table}>
          <thead><tr><th style={S.th}>Název</th><th style={S.th}>Datum</th><th style={S.th}>Status</th></tr></thead>
          <tbody>{recent.map(p=>(
            <tr key={p.id}>
              <td style={S.td}><div>{p.title}</div><div style={{fontSize:11,color:'var(--accent)',marginTop:2}}>{p.category}</div></td>
              <td style={{...S.td,color:'var(--muted)',whiteSpace:'nowrap'}}>{new Date(p.date).toLocaleDateString('cs-CZ')}</td>
              <td style={S.td}><span style={S.badge(p.status)}>{p.status==='published'?'Pub.':'Draft'}</span></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      <div style={{...S.card,textAlign:'center',padding:40}}>
        <p style={{color:'var(--muted)',marginBottom:16,fontSize:12}}>Každé uložení se okamžitě zapíše do GitHub repozitáře a projeví se na webu do 1 hodiny.</p>
        <button style={S.btnPrimary} onClick={onNew}>+ Napsat nový článek</button>
      </div>
    </div>
  );
}

// ── Posts list ───────────────────────────────────────────────
function Posts({posts,onNew,onEdit,onDelete,onToggle}){
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('all');
  const filtered=posts
    .filter(p=>filter==='all'||p.status===filter)
    .filter(p=>p.title.toLowerCase().includes(search.toLowerCase())||p.category.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  const pub=posts.filter(p=>p.status==='published').length;

  return(
    <div>
      <div style={{display:'flex',gap:12,marginBottom:24,flexWrap:'wrap',alignItems:'center'}}>
        <input style={{...S.input,marginTop:0,flex:1,minWidth:180}} placeholder="Hledat..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <div style={{display:'flex',gap:1,background:'var(--border)'}}>
          {[['all',`Vše (${posts.length})`],['published',`Pub. (${pub})`],['draft',`Draft (${posts.length-pub})`]].map(([v,l])=>(
            <button key={v} style={{...S.btnGhost,background:filter===v?'var(--surface)':'transparent',color:filter===v?'var(--accent)':'var(--muted)',border:'none',borderRadius:0}} onClick={()=>setFilter(v)}>{l}</button>
          ))}
        </div>
        <button style={S.btnPrimary} onClick={onNew}>+ Nový článek</button>
      </div>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
        <table style={S.table}>
          <thead><tr>
            <th style={S.th}>Název</th><th style={S.th}>Kategorie</th>
            <th style={S.th}>Datum</th><th style={S.th}>Status</th><th style={S.th}>Akce</th>
          </tr></thead>
          <tbody>{filtered.map(p=>(
            <tr key={p.id}>
              <td style={S.td}>
                <div style={{fontWeight:400}}>{p.title}</div>
                <div style={{fontSize:11,color:'var(--muted)',marginTop:2}}>{p.excerpt.slice(0,55)}{p.excerpt.length>55?'…':''}</div>
              </td>
              <td style={S.td}><span style={{color:'var(--accent)',fontSize:11}}>{p.category}</span></td>
              <td style={{...S.td,color:'var(--muted)',whiteSpace:'nowrap'}}>{new Date(p.date).toLocaleDateString('cs-CZ')}</td>
              <td style={S.td}><span style={S.badge(p.status)}>{p.status==='published'?'Publikováno':'Koncept'}</span></td>
              <td style={S.td}>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  <button style={S.btnGhost} onClick={()=>onEdit(p)}>Upravit</button>
                  <button style={{...S.btnGhost,color:p.status==='published'?'var(--muted)':'#6fcf97',borderColor:p.status==='published'?'var(--border)':'rgba(111,207,151,.3)'}} onClick={()=>onToggle(p.id)}>
                    {p.status==='published'?'Skrýt':'Publikovat'}
                  </button>
                  <button style={S.btnDanger} onClick={()=>onDelete(p)}>✕</button>
                </div>
              </td>
            </tr>
          ))}
          {!filtered.length&&<tr><td colSpan={5} style={{...S.td,textAlign:'center',color:'var(--muted)',padding:40}}>Žádné výsledky.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ── App root ─────────────────────────────────────────────────
function App(){
  const [token,setToken]=useState('');
  const [posts,setPosts]=useState([]);
  const [sha,setSha]=useState(null);
  const [loading,setLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const [page,setPage]=useState('dashboard');
  const [modal,setModal]=useState(null);
  const [editPost,setEditPost]=useState(null);
  const [deletePost,setDeletePost]=useState(null);
  const [toast,setToast]=useState(null);
  const [portfolio,setPortfolio]=useState([]);
  const [portfolioSha,setPortfolioSha]=useState(null);
  const [portfolioLoaded,setPortfolioLoaded]=useState(false);
  const [portfolioLoading,setPortfolioLoading]=useState(false);
  const [editPortfolioItem,setEditPortfolioItem]=useState(null);
  const [deletePortfolioItem,setDeletePortfolioItem]=useState(null);

  const toast$=(msg,type='ok')=>setToast({msg,type});

  // Lazy load portfolio when navigating to portfolio page
  useEffect(()=>{
    if(page==='portfolio'&&token&&!portfolioLoaded){
      setPortfolioLoading(true);
      loadPortfolioFromGitHub(token)
        .then(({items,sha})=>{setPortfolio(items);setPortfolioSha(sha);setPortfolioLoaded(true);})
        .catch(e=>toast$(`Chyba při načítání portfolia: ${e.message}`,'error'))
        .finally(()=>setPortfolioLoading(false));
    }
  },[page,token,portfolioLoaded]);

  // Load posts after login
  const connect=useCallback(async(t)=>{
    setLoading(true);
    try{
      const {posts:p,sha:s}=await loadPostsFromGitHub(t);
      setPosts(p); setSha(s); setToken(t);
    }catch(e){
      toast$(`Chyba při načítání: ${e.message}`,'error');
    }finally{setLoading(false);}
  },[]);

  // Save posts to GitHub and update sha
  const persist=useCallback(async(newPosts, commitMsg)=>{
    setSaving(true);
    toast$('Ukládám do GitHubu…','saving');
    try{
      const result=await savePostsToGitHub(newPosts, sha, token);
      setSha(result.content.sha);
      setPosts(newPosts);
      toast$(commitMsg||'✓ Uloženo do GitHubu.');
    }catch(e){
      toast$(`Chyba při ukládání: ${e.message}`,'error');
    }finally{setSaving(false);}
  },[sha,token]);

  const handleSave=useCallback(async(form)=>{
    let newPosts;
    if(editPost){
      newPosts=posts.map(p=>p.id===editPost.id?{...p,...form}:p);
    }else{
      newPosts=[{...form,id:Date.now()},...posts];
    }
    setModal(null);setEditPost(null);
    const msg=form.status==='published'?'✓ Článek publikován — projeví se do 1 hodiny.':'✓ Koncept uložen.';
    await persist(newPosts, `Blog: ${editPost?'edit':'add'} "${form.title}"`);
    toast$(msg);
  },[editPost,posts,persist]);

  const handleToggle=useCallback(async(id)=>{
    const post=posts.find(p=>p.id===id);
    const next=post.status==='published'?'draft':'published';
    const newPosts=posts.map(p=>p.id===id?{...p,status:next}:p);
    await persist(newPosts, `Blog: ${next==='published'?'publish':'unpublish'} "${post.title}"`);
    toast$(next==='published'?'✓ Článek publikován na webu.':'○ Článek skryt (koncept).');
  },[posts,persist]);

  const handleDeleteConfirm=useCallback(async()=>{
    const newPosts=posts.filter(p=>p.id!==deletePost.id);
    setModal(null);setDeletePost(null);
    await persist(newPosts, `Blog: delete "${deletePost.title}"`);
    toast$('Článek smazán.','error');
  },[posts,deletePost,persist]);

  const persistPortfolio=useCallback(async newItems=>{
    setSaving(true);toast$('Ukládám do GitHubu…','saving');
    try{
      const result=await savePortfolioToGitHub(newItems,portfolioSha,token);
      setPortfolioSha(result.content.sha);setPortfolio(newItems);
      toast$('✓ Portfolio uloženo.');
    }catch(e){toast$(`Chyba: ${e.message}`,'error');}
    finally{setSaving(false);}
  },[portfolioSha,token]);

  const handlePortfolioSave=useCallback(async form=>{
    const newItems=editPortfolioItem
      ?portfolio.map(p=>p.id===editPortfolioItem.id?{...p,...form}:p)
      :[{...form,id:Date.now()},...portfolio];
    setModal(null);setEditPortfolioItem(null);
    await persistPortfolio(newItems);
  },[editPortfolioItem,portfolio,persistPortfolio]);

  const handlePortfolioDelete=useCallback(async()=>{
    const newItems=portfolio.filter(p=>p.id!==deletePortfolioItem.id);
    setModal(null);setDeletePortfolioItem(null);
    await persistPortfolio(newItems);
    toast$('Položka smazána.','error');
  },[portfolio,deletePortfolioItem,persistPortfolio]);

  const logout=()=>{setToken('');setPosts([]);setSha(null);setPortfolio([]);setPortfolioSha(null);setPortfolioLoaded(false);};

  if(!token) return(
    <>{loading&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:9999,fontSize:12,color:'var(--muted)',letterSpacing:'0.1em'}}>Načítám…</div>}
    <SetupScreen onConnect={connect}/></>
  );

  const pub=posts.filter(p=>p.status==='published').length;

  return(
    <>
      <div style={S.sidebar}>
        <div style={S.sidebarHead}>
          <div style={S.logo}>Jan <span style={{color:'var(--accent)'}}>Novák</span></div>
          <div style={{fontSize:10,letterSpacing:'0.15em',color:'var(--muted)',textTransform:'uppercase'}}>Blog Admin</div>
        </div>
        <nav style={{padding:'16px 0',flex:1}}>
          {[{key:'dashboard',icon:'▦',label:'Přehled'},{key:'posts',icon:'≡',label:'Články'},{key:'portfolio',icon:'◫',label:'Portfolio'}].map(item=>(
            <div key={item.key} style={S.navItem(page===item.key)} onClick={()=>setPage(item.key)}>
              <span style={{fontSize:14,opacity:.8}}>{item.icon}</span>
              <span>{item.label}</span>
            </div>
          ))}
        </nav>
        <div style={S.sidebarFoot}>
          <div style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:10,letterSpacing:'0.12em',textTransform:'uppercase',padding:'4px 10px',border:'1px solid rgba(74,124,89,.3)',color:'#6fcf97',background:'rgba(74,124,89,.08)',marginBottom:14}}>
            ● {pub} {pub===1?'článek':'článků'} živě
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <a href="index.html" style={{color:'var(--accent)',textDecoration:'none',fontSize:11,letterSpacing:'0.1em'}}>← Zobrazit web</a>
            <button onClick={logout} style={{background:'none',border:'none',color:'var(--muted)',fontSize:11,cursor:'pointer',textAlign:'left',padding:0,letterSpacing:'0.1em'}}>Odhlásit se</button>
          </div>
        </div>
      </div>

      <div style={S.main}>
        <div style={S.topbar}>
          <div>
            <div style={S.topbarTitle}>{page==='dashboard'?'Přehled':page==='posts'?'Správa článků':'Portfolio'}</div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:2,letterSpacing:'0.1em'}}>
              {CONFIG.user}/{CONFIG.repo} · {new Date().toLocaleDateString('cs-CZ')}
            </div>
          </div>
          {page==='posts'&&<button style={S.btnPrimary} onClick={()=>{setEditPost(null);setModal('edit')}}>+ Nový článek</button>}
          {page==='portfolio'&&<button style={S.btnPrimary} onClick={()=>{setEditPortfolioItem(null);setModal('portfolioEdit')}}>+ Nová položka</button>}
        </div>
        <div style={S.content}>
          {page==='dashboard'&&<Dashboard posts={posts} onNew={()=>{setEditPost(null);setModal('edit')}} setPage={setPage}/>}
          {page==='posts'&&<Posts posts={posts} onNew={()=>{setEditPost(null);setModal('edit')}} onEdit={p=>{setEditPost(p);setModal('edit')}} onDelete={p=>{setDeletePost(p);setModal('delete')}} onToggle={handleToggle}/>}
          {page==='portfolio'&&<PortfolioList items={portfolio} onNew={()=>{setEditPortfolioItem(null);setModal('portfolioEdit')}} onEdit={p=>{setEditPortfolioItem(p);setModal('portfolioEdit')}} onDelete={p=>{setDeletePortfolioItem(p);setModal('portfolioDelete')}} loading={portfolioLoading}/>}
        </div>
      </div>

      {modal==='edit'&&<PostModal post={editPost} onSave={handleSave} onClose={()=>{setModal(null);setEditPost(null)}} saving={saving}/>}
      {modal==='delete'&&deletePost&&<ConfirmModal title={deletePost.title} onConfirm={handleDeleteConfirm} onClose={()=>{setModal(null);setDeletePost(null)}} saving={saving}/>}
      {modal==='portfolioEdit'&&<PortfolioModal item={editPortfolioItem} onSave={handlePortfolioSave} onClose={()=>{setModal(null);setEditPortfolioItem(null)}} saving={saving} token={token}/>}
      {modal==='portfolioDelete'&&deletePortfolioItem&&<ConfirmModal title={deletePortfolioItem.title} onConfirm={handlePortfolioDelete} onClose={()=>{setModal(null);setDeletePortfolioItem(null)}} saving={saving}/>}
      {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
